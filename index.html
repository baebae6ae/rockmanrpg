<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>균열 회수반</title>
    <meta name="theme-color" content="#0a0a12" />
    <!-- 아이폰 사파리는 manifest 의 아이콘을 "홈 화면에 추가"에 안 쓰고 이 태그를 본다 -->
    <link rel="apple-touch-icon" href="/rockmanrpg/icon-192.png" />
    <!-- 시스템 monospace 는 밋밋하다 — 픽셀 게임다운 도트 서체를 쓴다.
         Silkscreen 은 라틴 전용이라 한글 글리프가 없다 — "캐릭터 선택"
         같은 한글 UI 전부가 이 폰트 자체가 아니라 그 뒤에 적어 둔
         monospace 폴백(안티에일리어싱 벡터체)으로 그려지고 있었다.
         Galmuri(SIL OFL, 한글 도트 폰트)를 CSS font-family 뒤에 이어
         붙이면, 브라우저가 글자 단위로 Silkscreen 에 없는 글리프만
         자동으로 Galmuri 로 넘긴다 — 영문·숫자는 Silkscreen 그대로,
         한글만 도트로 그려진다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a12;
        /* 터치 조작 중 스크롤·확대·길게눌러 선택 방지 */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #stage {
        display: block;
        width: 100%;
        height: 100%;
        /* 픽셀 아트는 확대 시 보간하지 않는다 */
        image-rendering: pixelated;
        /* 캔버스가 화면에 떠 있지 않고 하나의 화면(screen)으로 읽히게 */
        outline: 1px solid #232c4e;
        box-shadow:
          0 0 0 4px #0d1124,
          0 18px 60px -20px #000;
      }
      #boot {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        font: 14px/1.6 ui-monospace, monospace;
        color: #6f7fa8;
        letter-spacing: 0.08em;
      }
    </style>
    <script type="module" crossorigin src="/rockmanrpg/assets/index-I0z_fDbf.js"></script>
  <link rel="manifest" href="/rockmanrpg/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/rockmanrpg/registerSW.js"></script></head>
  <body>
    <div id="boot">LOADING…</div>
    <canvas id="stage"></canvas>
  </body>
</html>
