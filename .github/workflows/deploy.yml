name: Build Check

# 실제 배포는 gh-pages 브랜치에 빌드 결과물을 직접 커밋하는 방식으로 한다.
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꾸기 전까지는
# 이 워크플로가 배포까지 하도록 둬 봐야 매번 deploy 단계에서 실패해
# 실패 메일만 쌓인다 (docs/DESIGN.md §10.2). 그래서 배포 단계는 빼고
# main 에 올라간 게 빌드는 되는지만 확인한다.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # 임시 도트 생성 → 데이터 검증 → 번들.
      - run: npm run build
