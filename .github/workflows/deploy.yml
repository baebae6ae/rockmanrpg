name: Deploy to GitHub Pages

# 기본 브랜치에 올라간 것만 배포한다. 저장소 Settings → Pages → Source 를
# "GitHub Actions" 로 바꾸기 전까지는 배포 단계가 실패하므로, 그때까지는
# 빌드 검증용으로만 돌아간다 (docs/DESIGN.md §10.2).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포를 취소하지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # 임시 도트 생성 → 데이터 검증 → 번들. 검증이 실패하면 배포하지 않는다.
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
